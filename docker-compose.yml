version: '3.8'

services:
  app:
    build:
      dockerfile: ./.docker/Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION}
        - APP_ROOT=${APP_ROOT}
        - XDEBUG_PORT=${XDEBUG_PORT}
        - WSL_IP=${WSL_IP}
    tty: true
    volumes:
      - .:/workspace:cached
      - ./.docker/php-config/php.ini:/usr/local/etc/php/conf.d/99-php.ini
      # Keep the GitHub CLI login across container rebuilds
      - gh-config:/root/.config/gh
    env_file:
      - .env

volumes:
  gh-config:
